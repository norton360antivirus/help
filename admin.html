<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norton Help — Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div class="login" id="login">
  <div class="login-card"><div class="mark">✓</div><h1>Norton Help</h1><p>Admin Portal</p>
    <form id="loginForm"><input id="loginEmail" type="email" required placeholder="Admin email"><input id="loginPassword" type="password" required placeholder="Password"><button>Sign In →</button><small>Only authorized admin accounts can access requests.</small></form>
  </div>
</div>
<div class="dashboard" id="dashboard">
<header><div><b>Norton Help</b><span>Admin Dashboard</span></div><button id="logout">Sign out</button></header>
<section class="stats"><div><small>Total</small><strong id="total">0</strong></div><div><small>Pending</small><strong id="pending">0</strong></div><div><small>Processing</small><strong id="processing">0</strong></div><div><small>Completed</small><strong id="completed">0</strong></div></section>
<main><div class="toolbar"><h2>Cancellation Requests</h2><div><input id="search" placeholder="Search name, email or phone"><select id="filter"><option value="all">All status</option><option>Pending</option><option>Processing</option><option>Completed</option><option>Rejected</option></select><button id="refresh">↻ Refresh</button></div></div>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Contact</th><th>Amount</th><th>Bank</th><th>Device</th><th>Cancel?</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">Loading...</td></tr></tbody></table></div></main>
</div>
<div class="modal" id="modal"><div class="modal-card"><button class="close" id="close">×</button><h3>Request Details</h3><div id="detail"></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body></html>
